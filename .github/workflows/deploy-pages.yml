# GitHub Pages HTML-зеркало отключено.
# Production — Next.js на Vercel (natali-neero.ru).
# Папка HTML/ не публикуется, чтобы не путать посетителей с устаревшей версией.
#
# Чтобы снова включить деплой Pages, восстановите job ниже и убедитесь,
# что HTML синхронизирован с Next.js (сейчас не поддерживается).

name: Deploy HTML to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to publish legacy HTML folder (not recommended)"
        required: true
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'ENABLE'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HTML

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
